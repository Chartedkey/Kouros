[package]
name = "kouros-coach-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
chrono = "0.4"
base64 = "0.22"
ring = "0.17.14"
getrandom = "0.2"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
calamine = "0.30"
