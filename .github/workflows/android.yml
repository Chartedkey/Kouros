name: Android validation and signed APK

on:
  push:
    branches: [android, android-stage1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android NDK and SDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}" "platforms;android-36" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          TC="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$TC" >> "$GITHUB_PATH"
          echo "RANLIB_aarch64_linux_android=$TC/llvm-ranlib" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TC/llvm-ar" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android
      - run: npm ci
      - run: npm run build
      - name: Generate Android project
        run: |
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/icon.png
      - name: Configure release signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 tools/android/signing.py
          python3 tools/android/prepare.py
      - name: Build APK
        run: npx tauri android build --apk true --aab false --target aarch64 --ci
      - name: Native update policy tests
        working-directory: src-tauri/gen/android
        run: ./gradlew :tauri-plugin-kouros-mobile:testDebugUnitTest
      - name: Verify and package
        run: |
          mkdir -p out
          V=$(node -p "require('./src-tauri/tauri.android.conf.json').version")
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' ! -name '*unsigned*' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "out/Kouros_${V}_android.apk"
          python3 tools/android/update_manifest.py "out/Kouros_${V}_android.apk" out/android-update.json
      - uses: actions/upload-artifact@v4
        with:
          name: Kouros-android-signed
          path: out/*
      - name: Remove temporary signing material
        if: always()
        run: rm -f src-tauri/gen/android/kouros-android.jks src-tauri/gen/android/keystore.properties
