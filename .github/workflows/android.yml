name: Сборка для Android

on:
  push:
    branches: [main, android]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$ANDROID_HOME/ndk" || true
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android

      - name: Установка зависимостей
        run: npm install

      # The phone has no auto-updater / restart plugins but has fingerprint unlock.
      - name: Права приложения для телефона
        run: |
          cat > src-tauri/capabilities/default.json <<'JSON'
          {
            "identifier": "default",
            "description": "Права главного окна (телефон)",
            "windows": ["main"],
            "permissions": ["core:default", "dialog:default", "biometric:default"]
          }
          JSON

      - name: Проект Android
        run: |
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/icon.png

      - name: Ключ подписи
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > src-tauri/gen/android/kouros-android.jks
            printf 'keyAlias=kouros\npassword=%s\nstoreFile=%s\n' "$KP" "$PWD/src-tauri/gen/android/kouros-android.jks" > src-tauri/gen/android/keystore.properties
            python3 tools/android/patch_gradle.py
          else
            echo "::warning::Нет секрета ANDROID_KEYSTORE — APK будет без подписи (поставить на телефон нельзя)."
          fi

      - name: Сборка APK
        run: npx tauri android build --apk --target aarch64 --ci

      - name: Файл APK
        id: apk
        run: |
          v=$(node -p "require('./package.json').version")
          f=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          echo "найден: $f"
          mkdir -p out
          cp "$f" "out/Kouros_${v}_android.apk"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Kouros-android-apk
          path: out/*.apk

      # On main: add the APK to the release the Windows build creates (waits for it).
      - name: APK в релиз
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.apk.outputs.version }}"
          for i in $(seq 1 60); do
            if gh release view "$tag" > /dev/null 2>&1; then
              gh release upload "$tag" out/*.apk --clobber
              exit 0
            fi
            sleep 60
          done
          echo "::error::Релиз $tag так и не появился"
          exit 1
