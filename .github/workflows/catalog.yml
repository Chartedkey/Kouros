name: Каталог добавок и лекарств

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['tools/catalog/**', '.github/workflows/catalog.yml']

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Сбор
        run: |
          cd tools/catalog
          if [ -f run.sh ]; then bash run.sh; else python probe.py; fi
      - name: Сохранить результат в ветку
        run: |
          git config user.name "kouros-catalog"
          git config user.email "actions@users.noreply.github.com"
          git add -A -f tools/catalog
          [ -d src-tauri/resources ] && git add -A src-tauri/resources || true
          git commit -m "Catalog data [skip ci]" || exit 0
          git push
