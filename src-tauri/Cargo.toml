[package]
name = "kouros"
version = "1.5.0"
description = "Kouros — личное приложение для спорта и здоровья"
edition = "2021"

[lib]
name = "kouros_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite with SQLCipher (AES-256), OpenSSL built from source so nothing is needed on the PC.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
getrandom = "0.2"
chrono = "0.4"
tauri-plugin-dialog = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio = { version = "1", features = ["time"] }
# Reading the medicine registry list (.xls) on «Обновить реестр».
calamine = "0.30"

# Desktop only: OS credential store, auto-update, restart.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Windows Credential Manager (and macOS Keychain later).
keyring = { version = "3", features = ["windows-native", "apple-native"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# 2.0: the phone app — fingerprint / face unlock.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Security_Credentials_UI",
  "Win32_Foundation",
  "Win32_System_WinRT",
] }

[profile.release]
strip = true
codegen-units = 4
